name: Benchmark

# Runs the full retrieval benchmark with the real models and commits the results
# (results/results.{json,md} and the README table) back to the branch.
# Trigger: "Run workflow" in the Actions tab, or push a commit whose message contains [bench].

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bench]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,dev]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/hybrid_rag/config.py') }}
      - name: Model integration tests
        run: pytest -m slow -v
      - name: Build vector index
        run: rag index
      - name: Evaluate all retrieval modes
        run: rag eval --update-readme | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update benchmark results"
            for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
          fi
