name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Unit tests use stand-in models, so torch/sentence-transformers aren't needed here.
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (downloads models and builds the index)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rag-hybrid-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name rag -p 7860:7860 rag-hybrid-search:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:7860/health && break
            sleep 2
          done
          curl -fsS -X POST localhost:7860/api/search \
            -H 'Content-Type: application/json' \
            -d '{"query": "How does LoRA reduce trainable parameters?", "k": 3}' | tee /tmp/out.json
          python3 -c "import json; hits = json.load(open('/tmp/out.json'))['hits']; assert hits[0]['doc_id'] == '2106.09685', hits[0]"
      - if: failure()
        run: docker logs rag || true
