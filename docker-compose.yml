# Production-style setup: the API talks to a standalone Qdrant server instead of the
# embedded on-disk index baked into the image. On first start the API builds the
# collection in Qdrant (about a minute on CPU); restarts reuse the persisted volume.
#
#   docker compose up --build
#   open http://localhost:8000

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  api:
    build: .
    depends_on: [qdrant]
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_BUILD_INDEX_ON_STARTUP: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

volumes:
  qdrant_data:
